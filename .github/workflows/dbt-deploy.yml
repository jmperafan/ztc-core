name: "dbt deploy"

# ----------------------------------------------------------------------------
# Approach: on every merge to main, trigger the production dbt platform job,
# poll until it finishes, then refresh a Power BI dataset.
#
# The Power BI step is included as a demonstration of a typical post-run
# downstream refresh. It is gated on PBI_* secrets being present — if they
# are not configured, that step skips cleanly and the workflow still passes.
#
# Required secrets (dbt platform):
#   DBT_CLOUD_API_TOKEN    — dbt platform personal or service account token
#   DBT_CLOUD_ACCOUNT_ID   — numeric account ID
#   DBT_CLOUD_PROD_JOB_ID  — production job ID
#
# Required variables:
#   DBT_CLOUD_BASE_URL     — e.g. https://de392.us1.dbt.com (no trailing slash)
#
# Optional secrets (Power BI — step skips if any are missing):
#   PBI_TENANT_ID
#   PBI_CLIENT_ID
#   PBI_CLIENT_SECRET
#   PBI_WORKSPACE_ID
#   PBI_DATASET_ID
# ----------------------------------------------------------------------------

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: dbt deploy
    runs-on: ubuntu-latest

    steps:
      - name: Trigger dbt job
        id: trigger
        run: |
          if [ -z "${{ vars.DBT_CLOUD_BASE_URL }}" ] || [ -z "${{ secrets.DBT_CLOUD_API_TOKEN }}" ] || [ -z "${{ vars.DBT_CLOUD_ACCOUNT_ID }}" ] || [ -z "${{ vars.DBT_CLOUD_PROD_JOB_ID }}" ]; then
            echo "Required secrets/vars not configured — skipping dbt deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Token ${{ secrets.DBT_CLOUD_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"cause":"Triggered by GitHub Actions — merge to main"}' \
            "${{ vars.DBT_CLOUD_BASE_URL }}/api/v2/accounts/${{ vars.DBT_CLOUD_ACCOUNT_ID }}/jobs/${{ vars.DBT_CLOUD_PROD_JOB_ID }}/run/")

          RUN_ID=$(echo "$RESPONSE" | jq -r '.data.id')
          RUN_URL=$(echo "$RESPONSE" | jq -r '.data.href')

          if [ "$RUN_ID" = "null" ] || [ -z "$RUN_ID" ]; then
            echo "Failed to trigger dbt run. API response: $RESPONSE"
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Triggered run $RUN_ID — $RUN_URL"

      - name: Poll until complete
        if: steps.trigger.outputs.skip != 'true'
        run: |
          RUN_ID="${{ steps.trigger.outputs.run_id }}"

          while true; do
            STATUS=$(curl -sf \
              -H "Authorization: Token ${{ secrets.DBT_CLOUD_API_TOKEN }}" \
              "${{ vars.DBT_CLOUD_BASE_URL }}/api/v2/accounts/${{ vars.DBT_CLOUD_ACCOUNT_ID }}/runs/$RUN_ID/" \
              | jq -r '.data.status')

            echo "Run status: $STATUS"

            case $STATUS in
              10) echo "Run succeeded"; break ;;
              20) echo "Run errored"; exit 1 ;;
              30) echo "Run cancelled"; exit 1 ;;
            esac

            sleep 30
          done

      - name: Refresh Power BI dataset
        id: pbi
        if: steps.trigger.outputs.skip != 'true'
        run: |
          if [ -z "${{ secrets.PBI_TENANT_ID }}" ] || [ -z "${{ secrets.PBI_CLIENT_ID }}" ] || [ -z "${{ secrets.PBI_CLIENT_SECRET }}" ] || [ -z "${{ secrets.PBI_WORKSPACE_ID }}" ] || [ -z "${{ secrets.PBI_DATASET_ID }}" ]; then
            echo "Power BI secrets not configured — skipping Power BI refresh."
            exit 0
          fi

          TOKEN=$(curl -sf -X POST \
              "https://login.microsoftonline.com/${{ secrets.PBI_TENANT_ID }}/oauth2/v2.0/token" \
              -d "grant_type=client_credentials&client_id=${{ secrets.PBI_CLIENT_ID }}&client_secret=${{ secrets.PBI_CLIENT_SECRET }}&scope=https://analysis.windows.net/powerbi/api/.default" \
              | jq -r '.access_token')

          curl -sf -X POST \
              "https://api.powerbi.com/v1.0/myorg/groups/${{ secrets.PBI_WORKSPACE_ID }}/datasets/${{ secrets.PBI_DATASET_ID }}/refreshes" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"notifyOption": "MailOnFailure"}'

          echo "Power BI refresh triggered"
