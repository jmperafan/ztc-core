name: "3 · dbt Cloud CI"

# ----------------------------------------------------------------------------
# Approach: trigger a dbt Cloud CI job via the API and poll until complete.
#
# This is the hard gate: it verifies that the SQL actually runs without errors
# against real data. The dbt Cloud job should be configured with:
#   - Commands:              dbt build --select state:modified+
#   - Defer to production:   enabled (points to your production job)
#
# Slim CI means only the models touched in this PR (and their downstream
# dependents) are rebuilt. Everything else is deferred to the last production
# state — keeping run times short even on large projects.
#
# Each PR runs in its own isolated schema (ci_pr_<number>) so CI never
# touches development or production data.
#
# Failures here mean the SQL errored or a dbt test failed.
#
# Required secrets:
#   DBT_CLOUD_API_TOKEN    — dbt Cloud personal or service account token
#   DBT_CLOUD_ACCOUNT_ID   — numeric account ID from the dbt Cloud URL
#   DBT_CLOUD_CI_JOB_ID    — job ID of your CI job in dbt Cloud
# ----------------------------------------------------------------------------

on:
  pull_request:
    branches: [main]

jobs:
  dbt-cloud-ci:
    name: dbt Cloud CI
    runs-on: ubuntu-latest

    steps:
      - name: Trigger dbt Cloud CI job
        id: trigger
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Token ${{ secrets.DBT_CLOUD_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"cause\":\"PR #${{ github.event.pull_request.number }}\",\"schema_override\":\"ci_pr_${{ github.event.pull_request.number }}\"}" \
            "https://cloud.getdbt.com/api/v2/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/jobs/${{ secrets.DBT_CLOUD_CI_JOB_ID }}/run/")

          echo "API response: $RESPONSE"

          RUN_ID=$(echo "$RESPONSE" | jq -r '.data.id')
          RUN_URL=$(echo "$RESPONSE" | jq -r '.data.href')

          if [ "$RUN_ID" = "null" ] || [ -z "$RUN_ID" ]; then
            echo "Failed to trigger dbt Cloud run. See API response above."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Triggered run $RUN_ID — $RUN_URL"

      - name: Poll until complete
        run: |
          RUN_ID="${{ steps.trigger.outputs.run_id }}"

          while true; do
            STATUS=$(curl -sf \
              -H "Authorization: Token ${{ secrets.DBT_CLOUD_API_TOKEN }}" \
              "https://cloud.getdbt.com/api/v2/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/runs/$RUN_ID/" \
              | jq -r '.data.status')

            echo "Run status: $STATUS"

            case $STATUS in
              10) echo "Run succeeded"; exit 0 ;;
              20) echo "Run errored"; exit 1 ;;
              30) echo "Run cancelled"; exit 1 ;;
            esac

            sleep 30
          done
