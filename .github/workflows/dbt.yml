name: "dbt"

# ----------------------------------------------------------------------------
# Approach: drive the dbt platform from the command line.
#
# The dbt platform CLI ships the checked-out project to a remote runner and
# streams the logs back, so `dbt build` here is the same command you run
# locally — no job IDs, no REST polling, no marketplace action. What you see
# in this file is what you would type in a terminal.
#
# Two entry points, one runner:
#   pull_request      → dbt build --select state:modified+   (Slim CI)
#   workflow_dispatch → whatever command you type in the UI  (deploy/backfill)
#
# ── Configuration ────────────────────────────────────────────────────────────
# The CLI reads these settings from the environment:
#   DBT_CLOUD_ACCOUNT_HOST   host, e.g. de392.us1.dbt.com (no scheme)
#   DBT_CLOUD_ACCOUNT_ID     numeric account ID
#   DBT_CLOUD_PROJECT_ID     numeric project ID
#   DBT_CLOUD_DEFER_ENV_ID   environment to defer to; required for state:modified+
#
# The token has no environment variable, so it has to be written to
# ~/.dbt/dbt_cloud.yml. That file is the *only* thing that needs to be a
# secret — everything else is a plain repo variable.
#
# Required secret:    DBT_CLOUD_API_TOKEN    (service account token)
# Required variables: DBT_CLOUD_ACCOUNT_HOST, DBT_CLOUD_ACCOUNT_ID,
#                     DBT_CLOUD_PROJECT_ID, DBT_CLOUD_PROD_ENV_ID
#
# Find the environment IDs under Deploy → Environments; the ID is the last
# path segment of the environment's URL. `dbt environment show` prints the
# resolved values, which is the fastest way to confirm the wiring.
# ----------------------------------------------------------------------------

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      command:
        description: "dbt command to run on the remote runner"
        required: true
        default: "build"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DBT_CLOUD_ACCOUNT_HOST: ${{ vars.DBT_CLOUD_ACCOUNT_HOST }}
  DBT_CLOUD_ACCOUNT_ID:   ${{ vars.DBT_CLOUD_ACCOUNT_ID }}
  DBT_CLOUD_PROJECT_ID:   ${{ vars.DBT_CLOUD_PROJECT_ID }}
  DBT_CLOUD_DEFER_ENV_ID: ${{ vars.DBT_CLOUD_PROD_ENV_ID }}
  DBT_CLI_VERSION:        "0.40.23"

jobs:
  dbt:
    name: dbt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # Slim CI needs the base commit to diff against, so fetch full history
        # rather than the default single-commit checkout.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the dbt platform CLI
        run: |
          curl -fsSL -o /tmp/dbt.tar.gz \
            "https://github.com/dbt-labs/dbt-cli/releases/download/v${DBT_CLI_VERSION}/dbt_${DBT_CLI_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/dbt.tar.gz -C "$HOME/.local/bin" dbt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Authenticate
        # Only the token lives here. Host, account and project come from the
        # env vars set above, which is why this file is five lines not forty.
        #
        # account-id is not optional: the CLI builds its API paths from it, so
        # omitting it makes every request come back "request not authorized",
        # which reads like a bad token and is not one.
        env:
          DBT_CLOUD_API_TOKEN: ${{ secrets.DBT_CLOUD_API_TOKEN }}
        run: |
          mkdir -p "$HOME/.dbt"
          install -m 600 /dev/null "$HOME/.dbt/dbt_cloud.yml"
          cat > "$HOME/.dbt/dbt_cloud.yml" << EOF
          version: "1"
          projects:
            - project-id: "${DBT_CLOUD_PROJECT_ID}"
              account-id: "${DBT_CLOUD_ACCOUNT_ID}"
              account-host: "${DBT_CLOUD_ACCOUNT_HOST}"
              token-name: "github-actions"
              token-value: "${DBT_CLOUD_API_TOKEN}"
          EOF

      - name: Show resolved environment
        # Cheap, and it turns "the run failed" into "the run failed because
        # the defer environment is N/A".
        run: dbt environment show

      - name: Install packages
        # The remote runner resolves packages from package-lock.yml, but
        # running deps explicitly makes the failure mode obvious if it ever
        # stops doing so.
        run: dbt deps

      - name: Build changed models
        if: github.event_name == 'pull_request'
        # state:modified+ resolves against DBT_CLOUD_DEFER_ENV_ID, so only the
        # models touched by this PR and their children are built; the rest are
        # deferred to production.
        run: dbt build --select state:modified+

      - name: Run requested command
        if: github.event_name == 'workflow_dispatch'
        # Via env, not interpolated into the command line: the input is
        # attacker-controlled in the sense that anyone who can trigger the
        # workflow could otherwise append arbitrary shell.
        env:
          DBT_COMMAND: ${{ github.event.inputs.command }}
        run: dbt $DBT_COMMAND
