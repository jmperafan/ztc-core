name: CI

on:
  pull_request:
    branches: [main]

jobs:

  # ----------------------------------------------------------------------------
  # Job 1: Lint — SQLFluff + pre-commit (no dbt or Snowflake needed)
  # ----------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

      - name: SQLFluff lint
        run: sqlfluff lint models/ macros/ --dialect snowflake --templater jinja

  # ----------------------------------------------------------------------------
  # Job 2: dbt Bouncer — enforce project conventions
  # Downloads manifest.json from the latest successful production run via the
  # dbt Cloud API — no dbt or Snowflake credentials needed in CI.
  # ----------------------------------------------------------------------------
  bouncer:
    name: dbt Bouncer
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Download production manifest from dbt Cloud
        run: |
          LATEST_RUN=$(curl -sf \
            -H "Authorization: Token ${{ secrets.DBT_CLOUD_API_TOKEN }}" \
            "https://cloud.getdbt.com/api/v2/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/runs/?job_definition_id=${{ secrets.DBT_CLOUD_PROD_JOB_ID }}&status=10&order_by=-finished_at&limit=1")

          RUN_ID=$(echo "$LATEST_RUN" | jq -r '.data[0].id')

          if [ "$RUN_ID" = "null" ] || [ -z "$RUN_ID" ]; then
            echo "No successful production run found. Cannot fetch manifest."
            exit 1
          fi

          mkdir -p target
          curl -sf \
            -H "Authorization: Token ${{ secrets.DBT_CLOUD_API_TOKEN }}" \
            "https://cloud.getdbt.com/api/v2/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/runs/$RUN_ID/artifacts/manifest.json" \
            -o target/manifest.json

          echo "Downloaded manifest from run $RUN_ID"

      - name: Run dbt Bouncer
        uses: godatadriven/dbt-bouncer@v0
        with:
          config-file: ./dbt-bouncer.yml
          send-pr-comment: "true"

  # ----------------------------------------------------------------------------
  # Job 3: dbt Cloud CI — trigger a CI job via the dbt Cloud API and poll until
  # complete. The job in dbt Cloud should be configured with:
  #   - Commands: dbt build --select state:modified+
  #   - Defer to a previous run state: <production job>
  # The schema_override isolates each PR in its own schema.
  # ----------------------------------------------------------------------------
  dbt-ci:
    name: dbt Cloud CI
    runs-on: ubuntu-latest
    needs: bouncer

    steps:
      - name: Trigger dbt Cloud CI job
        id: trigger
        run: |
          RESPONSE=$(curl -sf -X POST \
            -H "Authorization: Token ${{ secrets.DBT_CLOUD_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"cause\":\"PR #${{ github.event.pull_request.number }}\",\"schema_override\":\"ci_pr_${{ github.event.pull_request.number }}\"}" \
            "https://cloud.getdbt.com/api/v2/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/jobs/${{ secrets.DBT_CLOUD_CI_JOB_ID }}/run/")

          RUN_ID=$(echo "$RESPONSE" | jq -r '.data.id')
          RUN_URL=$(echo "$RESPONSE" | jq -r '.data.href')

          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Triggered run $RUN_ID — $RUN_URL"

      - name: Poll until complete
        run: |
          RUN_ID="${{ steps.trigger.outputs.run_id }}"

          while true; do
            STATUS=$(curl -sf \
              -H "Authorization: Token ${{ secrets.DBT_CLOUD_API_TOKEN }}" \
              "https://cloud.getdbt.com/api/v2/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/runs/$RUN_ID/" \
              | jq -r '.data.status')

            echo "Run status: $STATUS"

            case $STATUS in
              10) echo "Run succeeded"; exit 0 ;;
              20) echo "Run errored"; exit 1 ;;
              30) echo "Run cancelled"; exit 1 ;;
            esac

            sleep 30
          done
