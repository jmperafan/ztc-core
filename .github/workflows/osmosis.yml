name: "dbt-osmosis"

# ----------------------------------------------------------------------------
# Approach: isolated dbt-core environment, no interference with dbt Fusion.
#
# This project uses dbt Fusion locally, which rejects the +dbt-osmosis routing
# key as an unknown config. Instead of adding that key to dbt_project.yml, the
# routing config is passed directly as a --vars argument at runtime. The runner
# never commits anything back — the patch is ephemeral.
#
# This job installs dbt-core (not Fusion). The two runtimes are completely
# separate: Fusion runs locally, dbt-core runs here. They do not conflict.
#
# What dbt-osmosis checks:
#   - Column names in YAML match what the warehouse actually returns
#   - Columns present in the database but missing from YAML
#   - Stale columns in YAML that no longer exist in the database
#   - Empty descriptions that could be propagated from an upstream model
#
# Running with -C means osmosis exits non-zero if it would make any changes.
# The PR cannot merge until every YAML file is up to date.
#
# Required secrets:
#   SNOWFLAKE_ACCOUNT    — e.g. fka50167
#   SNOWFLAKE_USER       — your Snowflake username
#   SNOWFLAKE_PASSWORD   — your Snowflake password
#   SNOWFLAKE_ROLE       — e.g. TRANSFORMER
#   SNOWFLAKE_DATABASE   — e.g. ANALYTICS_DEV
#   SNOWFLAKE_WAREHOUSE  — e.g. TRANSFORMING
# ----------------------------------------------------------------------------

on:
  workflow_dispatch:

jobs:
  osmosis:
    name: dbt-osmosis YAML refactor check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt and dbt-osmosis
        run: pip install dbt-snowflake dbt-osmosis>=1.0.0

      - name: Write dbt profiles
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          zuilense_tennis_club:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                role: ${{ secrets.SNOWFLAKE_ROLE }}
                database: ${{ secrets.SNOWFLAKE_DATABASE }}
                warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                schema: public
          EOF

      - name: Check YAML files are up to date
        run: |
          dbt-osmosis yaml refactor -C \
            --vars '{"dbt_osmosis_default_path": "_{model}.yml"}'
