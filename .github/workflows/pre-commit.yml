name: "Pre-commit"

# ----------------------------------------------------------------------------
# Approach: run pre-commit against the PR's files. No dbt invocation, no
# warehouse credentials.
#
# This used to install dbt, write a Snowflake profile and run `dbt parse`
# purely so the manifest-aware dbt-checkpoint hooks had a target/manifest.json
# to read. Those six hooks are now dbt v2 project checks (see
# checks/_checks.yml) and run in the dbt checks workflow via `dbt check`.
#
# What is left in .pre-commit-config.yaml — formatting, the generic file
# hooks, sqlfluff, and the two dbt-checkpoint hooks that only read model SQL
# text — never needed the manifest, so this job no longer needs credentials
# and can never skip silently for want of them.
# ----------------------------------------------------------------------------

on:
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit deps
        run: pip install -r requirements-dev.txt

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
