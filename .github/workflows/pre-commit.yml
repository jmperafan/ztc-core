name: "Pre-commit"

# ----------------------------------------------------------------------------
# Approach: local tooling, no credentials required.
#
# Pre-commit hooks catch formatting issues (trailing whitespace, missing
# newlines, YAML syntax, Python formatting) before code is reviewed.
#
# This is the cheapest CI check — it runs entirely without a database or
# cloud account. Failures here mean the code isn't ready to review yet.
# ----------------------------------------------------------------------------

on:
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
