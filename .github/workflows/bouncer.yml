name: "dbt Bouncer"

# ----------------------------------------------------------------------------
# Approach: parse the PR's own code to produce a fresh manifest, then run
# dbt-bouncer against it.
#
# Previously this workflow downloaded the latest successful production
# manifest from dbt Cloud, which by definition can't reflect changes still
# in a PR (new models, new contracts, new tests). Switching to a local
# `dbt parse` makes bouncer evaluate what's actually being proposed.
#
# Failures here mean a model on this PR violates a project convention
# (e.g. missing tests, wrong naming pattern, staging model reading from
# another model). dbt-bouncer posts a comment on the PR explaining what
# failed.
#
# If the Snowflake secrets/vars aren't configured the job skips cleanly.
# ----------------------------------------------------------------------------

on:
  pull_request:
    branches: [main]

jobs:
  bouncer:
    name: dbt Bouncer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt dbt-snowflake

      - name: Configure dbt profile and parse
        id: parse
        env:
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          if [ -z "${{ vars.SNOWFLAKE_ACCOUNT }}" ] || [ -z "$SNOWFLAKE_USER" ] || [ -z "$SNOWFLAKE_PASSWORD" ]; then
            echo "Snowflake secrets/vars not configured — skipping dbt Bouncer."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          ztc_core:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ${{ vars.SNOWFLAKE_ACCOUNT }}
                user: $SNOWFLAKE_USER
                password: $SNOWFLAKE_PASSWORD
                role: ${{ vars.SNOWFLAKE_ROLE }}
                database: ${{ vars.SNOWFLAKE_DATABASE }}
                warehouse: ${{ vars.SNOWFLAKE_WAREHOUSE }}
                schema: ci_bouncer
          EOF

          dbt deps
          dbt parse

      - name: Run dbt Bouncer
        if: steps.parse.outputs.skip != 'true'
        uses: godatadriven/dbt-bouncer@v3
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          config-file: ./dbt-bouncer.yml
          send-pr-comment: "true"
