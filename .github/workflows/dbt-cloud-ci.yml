name: "dbt Cloud CI"

# ----------------------------------------------------------------------------
# Approach: run a dbt platform CI job for every PR via the official
# dbt Labs action, and post the result back as a PR comment.
#
# This is the hard gate: it verifies that the SQL actually runs without errors
# against real data. The dbt platform job should be configured with:
#   - Commands:              dbt build --select state:modified+
#   - Defer to production:   enabled (points to your production job)
#
# Slim CI means only the models touched in this PR (and their downstream
# dependents) are rebuilt. Everything else is deferred to the last production
# state — keeping run times short even on large projects.
#
# Each PR runs in its own isolated schema (ci_pr_<number>) so CI never
# touches development or production data.
#
# Failures here mean the SQL errored or a dbt test failed.
#
# Required secrets:
#   DBT_CLOUD_API_TOKEN    — dbt platform personal or service account token
#   DBT_CLOUD_ACCOUNT_ID   — numeric account ID
#   DBT_CLOUD_CI_JOB_ID    — job ID of your CI job
#
# Required variables:
#   DBT_CLOUD_BASE_URL     — e.g. https://de392.us1.dbt.com (no trailing slash)
# ----------------------------------------------------------------------------

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dbt-cloud-ci:
    name: dbt Cloud CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "${{ vars.DBT_CLOUD_BASE_URL }}" ] || [ -z "${{ secrets.DBT_CLOUD_API_TOKEN }}" ] || [ -z "${{ vars.DBT_CLOUD_ACCOUNT_ID }}" ] || [ -z "${{ vars.DBT_CLOUD_CI_JOB_ID }}" ]; then
            echo "Required secrets/vars not configured — skipping dbt Cloud CI."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Run dbt CI job
        if: steps.check.outputs.skip != 'true'
        uses: dbt-labs/dbt-cloud-job-action@v7.1.0
        with:
          dbt_cloud_url:        ${{ vars.DBT_CLOUD_BASE_URL }}
          dbt_cloud_token:      ${{ secrets.DBT_CLOUD_API_TOKEN }}
          dbt_cloud_account_id: ${{ vars.DBT_CLOUD_ACCOUNT_ID }}
          dbt_cloud_job_id:     ${{ vars.DBT_CLOUD_CI_JOB_ID }}
          git_sha:              ${{ github.event.pull_request.head.sha }}
          schema_override:      ci_pr_${{ github.event.pull_request.number }}
          cause:                "CI — PR #${{ github.event.pull_request.number }}"
          failure_on_error:     true
          interval:             30

      - name: Post result to PR
        if: always() && steps.check.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}'
            const icon   = status === 'success' ? '✅' : '❌'
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${icon} dbt Cloud CI job **${status}**.`
            })
