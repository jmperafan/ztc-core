repos:
  ######
  #
  # Standard hooks for any repo
  #
  #####
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-json
      - id: check-ast
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: [--unsafe]
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: .+\.csv$
      - id: no-commit-to-branch
        args: [--branch, main]

  ######
  #
  # Hooks for python files
  #
  #####
  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: isort --profile black --filter-files
        language: python
        additional_dependencies: [isort]
        pass_filenames: true
        types_or: [python, pyi]
  - repo: local
    hooks:
      - id: black
        name: Run black formatter
        entry: black
        language: python
        additional_dependencies: [black]
        pass_filenames: true
        types_or: [python, pyi]
  - repo: local
    hooks:
      - id: autoflake
        name: Run autoflake
        entry: autoflake --in-place --remove-all-unused-imports
        language: python
        additional_dependencies: [autoflake]
        pass_filenames: true
        types_or: [python, pyi]
  - repo: local
    hooks:
      - id: pyupgrade
        name: Check for code that can use new Python features
        entry: pyupgrade --py311-plus
        language: python
        additional_dependencies: [pyupgrade]
        pass_filenames: true
        types_or: [python, pyi]

  ######
  #
  # Hooks for dbt projects
  #
  #####
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.1.0
    hooks:
      - id: sqlfluff-lint
        exclude: ^snapshots/
      - id: sqlfluff-fix
        exclude: ^snapshots/

  # dbt-checkpoint: static checks on dbt models, sources, and macros.
  # The manifest-aware hooks expect target/manifest.json — run `dbt parse`
  # locally (or `dbt build`) before committing if the hooks complain.
  - repo: https://github.com/dbt-checkpoint/dbt-checkpoint
    rev: v2.0.9
    hooks:
      # Models — scope to models/ and include YAML so the hooks can read
      # property files directly instead of relying on the manifest (which is
      # always stale for new models in CI's prod-manifest fetch).
      - id: check-model-has-description
        files: ^models/.+\.(sql|ya?ml)$
      - id: check-model-has-tests
        files: ^models/.+\.(sql|ya?ml)$
      - id: check-model-has-properties-file
        files: ^models/.+\.(sql|ya?ml)$
      - id: check-model-columns-have-desc
        files: ^models/.+\.(sql|ya?ml)$
      # SQL style — these don't need the manifest
      - id: check-script-ref-and-source
        files: ^models/.+\.sql$
      - id: check-script-has-no-table-name
        files: ^models/.+\.sql$
      # Sources — scope to models/ YAML where source blocks live.
      # check-source-has-freshness is intentionally omitted: it only reads
      # top-level loaded_at_field/freshness, but dbt Fusion's strict schema
      # requires those under `config:`. The two are mutually incompatible
      # until dbt-checkpoint catches up to v12 manifest schema.
      - id: check-source-has-description
        files: ^models/.+\.ya?ml$
      - id: check-source-columns-have-desc
        files: ^models/.+\.ya?ml$
      # check-macro-has-description was tried but is incompatible with this
      # project's macro layout: the hook requires SQL filename == macro name,
      # which does not hold here (e.g. macros/data_cleaning/age_groups.sql
      # defines age_group).
      # Documenting macros in macros/macros.yml is enforced by convention.
