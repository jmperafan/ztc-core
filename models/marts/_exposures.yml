exposures:
  - name: semantic_layer_google_sheets
    label: "dbt Semantic Layer — Google Sheets"
    type: application
    maturity: medium
    url: https://docs.getdbt.com/docs/use-dbt-semantic-layer/gsheets
    description: >
      Google Sheets connected to the dbt Semantic Layer via the native
      dbt Cloud add-on. Enables ad-hoc metric queries directly from
      spreadsheets without writing SQL.
    depends_on:
      - ref('fct_court_usage')
      - ref('fct_weather')
      - ref('fct_reservations')
      - ref('dim_members_anonimized')
    owner:
      name: ZTC Analytics
      email: analytics@ztc.nl

  - name: semantic_layer_api
    label: "dbt Semantic Layer — JDBC/GraphQL API"
    type: application
    maturity: low
    url: https://docs.getdbt.com/docs/use-dbt-semantic-layer/sl-api-overview
    description: >
      The dbt Semantic Layer exposes a JDBC endpoint and a GraphQL API.
      Any JDBC-compatible BI tool (Tableau, Mode, Hex, Lightdash) can
      connect and query metrics without writing SQL.
    depends_on:
      - ref('fct_court_usage')
      - ref('fct_weather')
      - ref('fct_reservations')
      - ref('dim_members_anonimized')
    owner:
      name: ZTC Analytics
      email: analytics@ztc.nl
