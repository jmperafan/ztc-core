semantic_models:
  - name: court_usage
    description: >
      One row per court-slot covering every minute of every day: actual bookings,
      available (gap-fill) slots, and closed hours. Use this model to compute
      court utilization as booked minutes divided by available minutes.
    model: ref('fct_court_usage')
    defaults:
      agg_time_dimension: reservation_date

    entities:
      - name: court_usage_slot
        type: primary
        expr: >
          CONCAT(
            CAST(court_number AS VARCHAR),
            '_',
            CAST(reservation_date AS VARCHAR),
            '_',
            CAST(start_time AS VARCHAR)
          )

    dimensions:
      - name: reservation_date
        type: time
        type_params:
          time_granularity: day
      - name: court_number
        type: categorical
      - name: reservation_type
        type: categorical
      - name: is_winter_break
        type: categorical

    measures:
      - name: booked_minutes
        description: >
          Total minutes where reservation_type is a real booking
          (not available or closed).
        agg: sum
        expr: >
          CASE
            WHEN reservation_type NOT IN ('Beschikbaar', 'Gesloten')
            THEN duration_in_mins
            ELSE 0
          END

      - name: available_minutes
        description: >
          Total minutes where the court was open to be booked (available + booked,
          excludes closed hours). Used as the denominator for court utilization.
        agg: sum
        expr: >
          CASE
            WHEN reservation_type != 'Gesloten'
            THEN duration_in_mins
            ELSE 0
          END

  - name: weather
    description: >
      One row per hour of weather data for Utrecht. The ideal_weather boolean
      is pre-computed using the tennis_weather macro: temperature 10–35°C,
      no precipitation, wind speed at or below 20 km/h.
    model: ref('fct_weather')
    defaults:
      agg_time_dimension: datetime

    entities:
      - name: weather_hour
        type: primary
        expr: datetime

    dimensions:
      - name: datetime
        type: time
        type_params:
          time_granularity: hour
      - name: ideal_weather
        type: categorical

    measures:
      - name: ideal_weather_hours
        description: Count of hours where all tennis-weather conditions are met.
        agg: sum
        expr: "CAST(ideal_weather AS INTEGER)"

  - name: reservations
    description: >
      One row per actual reservation. This is the cleanest grain for counting
      bookings — no gap-fill rows, no available/closed slots.
    model: ref('fct_reservations')
    defaults:
      agg_time_dimension: reservation_date

    entities:
      - name: reservation
        type: primary
        expr: reservation_id

    dimensions:
      - name: reservation_date
        type: time
        type_params:
          time_granularity: day
      - name: court_number
        type: categorical
      - name: reservation_type
        type: categorical

    measures:
      - name: reservation_count
        description: Total number of reservations.
        agg: count
        expr: reservation_id

  - name: members
    description: >
      Anonymised member dimension. One row per current or former member of ZTC.
      Use this model to count active members and slice by demographic attributes.
    model: ref('dim_members_anonimized')
    defaults:
      agg_time_dimension: member_since

    entities:
      - name: member
        type: primary
        expr: member_id

    dimensions:
      - name: member_since
        type: time
        type_params:
          time_granularity: day
      - name: gender
        type: categorical
      - name: age_group
        type: categorical
      - name: city
        type: categorical
      - name: current_type_of_membership
        type: categorical
      - name: is_club_member
        type: categorical
      - name: is_knltb_member
        type: categorical

    measures:
      - name: active_member_count
        description: >
          Count of distinct members who currently hold an active club membership
          (is_club_member = TRUE).
        agg: count_distinct
        expr: "CASE WHEN is_club_member = TRUE THEN member_id ELSE NULL END"
