models:
  - name: dim_calendar
    description: >
      Date dimension covering every calendar day from start_date to the current date.
      Generated with a recursive CTE. Use date_key to join to fact tables on
      reservation_date or similar date columns.
    columns:
      - name: date_key
        description: Calendar date. Primary key.
        data_tests:
          - unique
          - not_null

  - name: dim_members
    description: >
      One row per club member, enriched with calculated age, age_group bucket,
      and membership_length_in_months derived at query time from CURRENT_DATE().
    columns:
      - name: member_id
        description: Unique club membership number. Primary key.
        data_tests:
          - unique
          - not_null

  - name: fct_court_usage
    description: >
      One row per court-slot covering every minute of every day: actual bookings,
      available (gap-fill) slots, and closed hours. Use this model to compute
      court utilization as booked minutes divided by available minutes.
    semantic_model:
      enabled: true
    columns:
      - name: slot_key
        description: >
          Surrogate primary key composed of court_number, reservation_date,
          and start_time (e.g. "1_2023-06-15_08:00:00").
        data_tests:
          - unique
          - not_null
        entity:
          type: primary
          name: court_usage_slot
      - name: reservation_date
        description: Calendar date of the slot.
        granularity: day
        dimension:
          type: time
      - name: court_number
        description: Tennis court number (1–5).
        dimension:
          type: categorical
      - name: reservation_type
        description: >
          Type of slot. Actual reservation types from the source system,
          "Beschikbaar" for available (gap-fill) slots, or "Gesloten" for
          closed hours outside operating times.
        dimension:
          type: categorical
      - name: is_winter_break
        description: >
          True when the slot falls within a known ZTC winter break period
          (courts closed for the season).
        dimension:
          type: categorical
    metrics:
      - name: booked_minutes
        description: >
          Total minutes where reservation_type is a real booking
          (not available or closed).
        type: simple
        agg: sum
        agg_time_dimension: reservation_date
        expr: >
          CASE
            WHEN reservation_type NOT IN ('Beschikbaar', 'Gesloten')
            THEN duration_in_mins
            ELSE 0
          END
      - name: available_minutes
        description: >
          Total minutes where the court was open to be booked (available + booked,
          excludes closed hours). Used as the denominator for court utilization.
        type: simple
        agg: sum
        agg_time_dimension: reservation_date
        expr: >
          CASE
            WHEN reservation_type != 'Gesloten'
            THEN duration_in_mins
            ELSE 0
          END

  - name: fct_weather
    description: >
      One row per hour of weather data for Utrecht. The ideal_weather boolean
      is pre-computed using the tennis_weather macro: temperature 10–35°C,
      no precipitation, wind speed at or below 20 km/h.
    semantic_model:
      enabled: true
    columns:
      - name: datetime
        description: Timestamp of the observation, truncated to the hour. Primary key.
        granularity: hour
        data_tests:
          - unique
          - not_null
        entity:
          type: primary
          name: weather_hour
        dimension:
          type: time
      - name: ideal_weather
        description: >
          True when all tennis-weather conditions are met: temperature 10–35°C,
          no precipitation, wind speed ≤ 20 km/h.
        dimension:
          type: categorical
    metrics:
      - name: ideal_weather_hours
        description: Count of hours where all tennis-weather conditions are met.
        type: simple
        agg: sum
        agg_time_dimension: datetime
        expr: "CAST(ideal_weather AS INTEGER)"

  - name: fct_reservations
    description: >
      One row per actual reservation. This is the cleanest grain for counting
      bookings — no gap-fill rows, no available/closed slots.
    semantic_model:
      enabled: true
    columns:
      - name: reservation_id
        description: Synthetic surrogate key for the reservation. Primary key.
        data_tests:
          - unique
          - not_null
        entity:
          type: primary
          name: reservation
      - name: reservation_date
        description: Calendar date on which the reservation takes place.
        granularity: day
        dimension:
          type: time
      - name: court_number
        description: Tennis court number (1–5).
        dimension:
          type: categorical
      - name: reservation_type
        description: Category of the reservation as provided by the source system.
        dimension:
          type: categorical
    metrics:
      - name: total_reservations
        description: Total number of actual court reservations.
        type: simple
        agg: count
        agg_time_dimension: reservation_date
        expr: reservation_id
