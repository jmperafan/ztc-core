models:
  - name: dim_calendar
    config:
      contract:
        enforced: true
    description: >
      Date dimension covering every calendar day from start_date to the current date.
      Generated with a recursive CTE. Use date_key to join to fact tables on
      reservation_date or similar date columns.
    columns:
      - name: date_key
        data_type: date
        description: Calendar date. Primary key.
        data_tests:
          - unique
          - not_null

  - name: dim_members
    config:
      contract:
        enforced: true
    description: >
      One row per club member, enriched with calculated age, age_group bucket,
      and membership_length_in_months derived at query time from CURRENT_DATE().
    columns:
      - name: member_id
        data_type: number
        description: Unique club membership number. Primary key.
        data_tests:
          - unique
          - not_null
      - name: post_code
        data_type: varchar
        description: Member's postal code.
      - name: city
        data_type: varchar
        description: Member's city of residence.
      - name: country
        data_type: varchar
        description: Member's country of residence.
      - name: labels
        data_type: varchar
        description: Custom labels assigned to the member in the club system.
      - name: roll
        data_type: varchar
        description: Role(s) the member holds at the club (e.g. board, volunteer).
      - name: is_club_member
        data_type: boolean
        description: True if the member holds an active club membership.
      - name: is_knltb_member
        data_type: boolean
        description: True if the member is also registered with the national tennis federation (KNLTB).
      - name: gender
        data_type: varchar
        description: Member's gender as recorded by the club.
      - name: current_type_of_membership
        data_type: varchar
        description: Name of the currently active membership tier.
      - name: current_membership_start_date
        data_type: date
        description: Start date of the current membership tier.
      - name: inactive_type_of_membership
        data_type: varchar
        description: Name of the most recent lapsed membership tier.
      - name: former_membership_start_date
        data_type: date
        description: Start date of the most recent lapsed membership tier.
      - name: active_products
        data_type: varchar
        description: Additional products (e.g. locker rental) currently subscribed to.
      - name: active_product_date
        data_type: date
        description: Start date of active additional products.
      - name: inactive_products
        data_type: varchar
        description: Additional products that are no longer active.
      - name: inactive_products_date
        data_type: date
        description: Start date of lapsed additional products.
      - name: additional_information
        data_type: varchar
        description: Free-text extra information field from the club system.
      - name: reasons_for_cancellation
        data_type: varchar
        description: Reason code for membership cancellation, if applicable.
      - name: reasons_for_cancellation_comment
        data_type: varchar
        description: Free-text comment accompanying the cancellation reason.
      - name: club_app_login_date
        data_type: date
        description: Date the member last logged in to the club app.
      - name: services_current_year
        data_type: float
        description: Number of volunteer service points accumulated in the current season.
      - name: singles_level
        data_type: float
        description: KNLTB playing strength rating for singles (lower is stronger).
      - name: doubles_level
        data_type: float
        description: KNLTB playing strength rating for doubles.
      - name: padel_level
        data_type: float
        description: Playing strength rating for padel.
      - name: ranking_singles
        data_type: float
        description: National singles ranking number.
      - name: ranking_doubles
        data_type: float
        description: National doubles ranking number.
      - name: ranking_padel
        data_type: float
        description: National padel ranking number.
      - name: choice_of_membership
        data_type: varchar
        description: Membership option selected by the member during sign-up.
      - name: volunteer_type
        data_type: varchar
        description: Type of volunteer work the member is registered for.
      - name: birth_date
        data_type: date
        description: Member's date of birth.
      - name: member_since
        data_type: date
        description: Date the member joined the club.
      - name: age
        data_type: number
        description: Member's current age in years, derived from birth_date at query time.
      - name: age_group
        data_type: number
        description: Age group bucket (floor to nearest decade, e.g. 30 = 30–39).
      - name: membership_length_in_months
        data_type: number
        description: Months since the member joined, derived from member_since at query time.

  - name: fct_court_usage
    config:
      contract:
        enforced: true
    description: >
      One row per court-slot covering every minute of every day: actual bookings,
      available (gap-fill) slots, and closed hours. Use this model to compute
      court utilization as booked minutes divided by available minutes.
    columns:
      - name: slot_key
        data_type: varchar
        description: >
          Surrogate primary key composed of court_number, reservation_date,
          and start_time (e.g. "1_2023-06-15_08:00:00").
        data_tests:
          - unique
          - not_null
      - name: reservation_id
        data_type: varchar
        description: >
          Surrogate key of the original reservation for actual bookings.
          NULL for synthetic gap-fill and closed-hour rows.
      - name: court_number
        data_type: NUMBER(2, 0)
        description: Tennis court number (1–5).
      - name: reservation_date
        data_type: date
        description: Calendar date of the slot.
      - name: start_time
        data_type: time
        description: Start time of the slot (24-hour).
      - name: end_time
        data_type: time
        description: End time of the slot (24-hour).
      - name: reservation_type
        data_type: varchar
        description: >
          Type of slot. Actual reservation types from the source system,
          "Beschikbaar" for available (gap-fill) slots, or "Gesloten" for
          closed hours outside operating times.
      - name: event_description
        data_type: varchar
        description: Description of the event. "Niet geboekt" for available gaps; NULL for closed hours.
      - name: duration_in_mins
        data_type: NUMBER(10, 0)
        description: Duration of the slot in minutes.
      - name: is_winter_break
        data_type: boolean
        description: >
          True when the slot falls within a known ZTC winter break period
          (courts closed for the season).

  - name: fct_weather
    config:
      contract:
        enforced: true
    description: >
      One row per hour of weather data for Utrecht. The ideal_weather boolean
      is pre-computed using the tennis_weather macro: temperature 10–35°C,
      no precipitation, wind speed at or below 20 km/h.
    columns:
      - name: datetime
        data_type: timestamp_ntz
        description: Timestamp of the observation, truncated to the hour. Primary key.
        data_tests:
          - unique
          - not_null
      - name: temperature
        data_type: float
        description: Air temperature in degrees Celsius.
      - name: thermal_sensation
        data_type: float
        description: Feels-like temperature in degrees Celsius.
      - name: humidity
        data_type: float
        description: Relative humidity as a percentage (0–100).
      - name: precipitation
        data_type: float
        description: Precipitation amount in millimetres.
      - name: snow
        data_type: float
        description: Snowfall amount in centimetres.
      - name: wind_gust
        data_type: float
        description: Maximum wind gust speed in km/h.
      - name: wind_speed
        data_type: float
        description: Average wind speed in km/h.
      - name: solar_energy
        data_type: float
        description: Solar energy in mega-joules per square metre.
      - name: ideal_weather
        data_type: boolean
        description: >
          True when all tennis-weather conditions are met: temperature 10–35°C,
          no precipitation, wind speed ≤ 20 km/h.

  - name: bridge_member_reservations
    config:
      contract:
        enforced: true
    description: >
      Bridge table linking reservations to members. Filters out reservations with
      no member ID and ensures referential integrity with dim_members via an inner
      join. One row per reservation that can be attributed to a known club member.
    columns:
      - name: reservation_id
        data_type: varchar
        description: Foreign key to fct_reservations. Primary key of this bridge.
        data_tests:
          - unique
          - not_null
      - name: member_id
        data_type: number
        description: Foreign key to dim_members.
        data_tests:
          - not_null

  - name: fct_reservations
    config:
      contract:
        enforced: true
    description: >
      One row per actual reservation. This is the cleanest grain for counting
      bookings — no gap-fill rows, no available/closed slots.
    columns:
      - name: reservation_id
        data_type: varchar
        description: Deterministic surrogate key — hash of (court_number, reservation_date, start_time). Primary key.
        data_tests:
          - unique
          - not_null
      - name: reservation_date
        data_type: date
        description: Calendar date on which the reservation takes place.
      - name: reservation_start
        data_type: timestamp_ntz
        description: Full timestamp of the reservation start.
      - name: reservation_end
        data_type: timestamp_ntz
        description: Full timestamp of the reservation end.
      - name: start_time
        data_type: time
        description: Start time of the reservation (TIME, 24-hour).
      - name: end_time
        data_type: time
        description: End time of the reservation (TIME, 24-hour).
      - name: court_number
        data_type: number
        description: Tennis court number (1–5).
      - name: reservation_type
        data_type: varchar
        description: Category of the reservation as provided by the source system.
      - name: event_description
        data_type: varchar
        description: Free-text description of the event or booking.
      - name: duration_in_mins
        data_type: number
        description: Duration of the reservation in minutes.

  - name: fct_reservation_events
    # Contract intentionally not enforced: dbt requires on_schema_change to be
    # 'fail' or 'append_new_columns' with contracts, and Snowflake's natural
    # column precisions (NUMBER(2,0) from HOUR(), DAYOFWEEK(); NUMBER(13,0)
    # from COUNT_IF; etc.) drift from the generic `number` declaration on
    # every microbatch insert, breaking on_schema_change=fail.
    description: >
      One row per actual court booking enriched with member demographics.
      Microbatch incremental (batch_size=month, lookback=3).
    columns:
      - name: reservation_id
        data_type: varchar
        description: Surrogate key for the reservation. Primary key.
        data_tests:
          - unique
          - not_null
      - name: reservation_date
        data_type: date
        description: Calendar date of the booking.
        data_tests:
          - not_null
      - name: court_number
        data_type: number
        description: Tennis court number (1–5).
        data_tests:
          - not_null
      - name: start_time
        data_type: time
        description: Start time of the reservation (TIME, 24-hour).
      - name: end_time
        data_type: time
        description: End time of the reservation (TIME, 24-hour).
      - name: duration_in_mins
        data_type: number
        description: Duration of the reservation in minutes.
      - name: day_of_week
        data_type: number
        description: Day-of-week integer (1 = Sunday, 7 = Saturday in Snowflake).
      - name: day_of_week_name
        data_type: varchar
        description: Full day name (e.g. Monday).
      - name: start_hour
        data_type: number
        description: Hour component of start_time (0–23).
      - name: member_id
        data_type: number
        description: Foreign key to dim_members. NULL for guest bookings.
      - name: gender
        data_type: varchar
        description: Member's gender. NULL for unlinked bookings.
      - name: age_group
        data_type: number
        description: Member's age group bucket. NULL for unlinked bookings.
      - name: city
        data_type: varchar
        description: Member's city of residence. NULL for unlinked bookings.
      - name: current_type_of_membership
        data_type: varchar
        description: Name of the member's active membership tier. NULL for unlinked bookings.
      - name: is_club_member
        data_type: boolean
        description: True if the member holds an active club membership.
      - name: is_knltb_member
        data_type: boolean
        description: True if the member is registered with the national tennis federation.

  - name: fct_daily_court_stats
    # Contract intentionally not enforced: see comment on fct_reservation_events.
    description: >
      Daily aggregation of court usage per court. One row per court_number × reservation_date,
      covering non-winter-break days only.
    columns:
      - name: daily_court_key
        data_type: varchar
        description: Surrogate key — CONCAT(court_number, '_', reservation_date). Primary key.
        data_tests:
          - unique
          - not_null
      - name: court_number
        data_type: number
        description: Tennis court number (1–5).
        data_tests:
          - not_null
      - name: reservation_date
        data_type: date
        description: Calendar date of the aggregated slots.
        data_tests:
          - not_null
      - name: booked_slots
        data_type: number
        description: Number of minute-level slots marked as booked.
      - name: available_slots
        data_type: number
        description: Number of minute-level slots marked as available.
      - name: total_playable_slots
        data_type: number
        description: Total booked + available slots (excludes closed hours).
      - name: booked_minutes
        data_type: number
        description: Total minutes booked on this court on this date.
      - name: available_minutes
        data_type: number
        description: Total playable minutes on this court on this date.
      - name: utilization_pct
        data_type: number
        description: Share of playable minutes that were booked (%).

  - name: fct_hourly_weather_usage
    # Contract intentionally not enforced: see comment on fct_reservation_events.
    description: >
      One row per court × date × hour. Court usage aggregated to hourly grain
      and joined with weather observations for that hour.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - reservation_date
              - start_hour
              - court_number
    columns:
      - name: reservation_date
        data_type: date
        description: Calendar date of the hour.
        data_tests:
          - not_null
      - name: start_hour
        data_type: number
        description: Hour of day (0–23).
        data_tests:
          - not_null
      - name: court_number
        data_type: number
        description: Tennis court number (1–5).
        data_tests:
          - not_null
      - name: booked_slots
        data_type: number
        description: Number of minute-level slots marked as booked in this hour.
      - name: available_slots
        data_type: number
        description: Number of minute-level slots available in this hour.
      - name: utilization_pct
        data_type: number
        description: Share of playable slots in this hour that were booked (%).
      - name: temperature
        data_type: float
        description: Air temperature in °C.
      - name: precipitation
        data_type: float
        description: Precipitation in mm.
      - name: wind_speed
        data_type: float
        description: Wind speed in km/h.
      - name: ideal_weather
        data_type: boolean
        description: True when conditions are ideal for tennis (temp 10–35°C, no rain, wind ≤ 20 km/h).

  - name: fct_reservations_hwm
    # Contract intentionally not enforced: see comment on fct_reservation_events.
    description: >
      One row per actual court booking enriched with member demographics and weather.
      Built with the High Watermark pattern: the upper-bound timestamp is stored in
      a central watermark table before execution, making processing windows mutually
      exclusive and collectively exhaustive.
    columns:
      - name: reservation_id
        data_type: varchar
        description: Surrogate key for the reservation. Primary key.
        data_tests:
          - unique
          - not_null
      - name: reservation_date
        data_type: date
        description: Calendar date of the booking.
        data_tests:
          - not_null
      - name: court_number
        data_type: number
        description: Tennis court number (1–5).
        data_tests:
          - not_null
      - name: start_time
        data_type: time
        description: Start time of the reservation (TIME, 24-hour).
      - name: end_time
        data_type: time
        description: End time of the reservation (TIME, 24-hour).
      - name: duration_in_mins
        data_type: number
        description: Duration of the reservation in minutes.
      - name: day_of_week
        data_type: number
        description: Day-of-week integer (1 = Sunday, 7 = Saturday in Snowflake).
      - name: day_of_week_name
        data_type: varchar
        description: Full day name (e.g. Monday).
      - name: start_hour
        data_type: number
        description: Hour component of start_time (0–23).
      - name: member_id
        data_type: number
        description: Foreign key to dim_members. NULL for guest bookings.
      - name: gender
        data_type: varchar
        description: Member's gender. NULL for unlinked bookings.
      - name: age_group
        data_type: number
        description: Member's age group bucket. NULL for unlinked bookings.
      - name: city
        data_type: varchar
        description: Member's city of residence. NULL for unlinked bookings.
      - name: current_type_of_membership
        data_type: varchar
        description: Member's active membership tier. NULL for unlinked bookings.
      - name: is_club_member
        data_type: boolean
        description: True if the member holds an active club membership.
      - name: is_knltb_member
        data_type: boolean
        description: True if the member is registered with the national tennis federation.
      - name: temperature
        data_type: float
        description: Air temperature in °C at the hour of the booking.
      - name: precipitation
        data_type: float
        description: Precipitation in mm at the hour of the booking.
      - name: wind_speed
        data_type: float
        description: Wind speed in km/h at the hour of the booking.
      - name: ideal_weather
        data_type: boolean
        description: True when tennis conditions were ideal (temp 10–35°C, no rain, wind ≤ 20 km/h).

  # ── Demo-expansion marts (coaching, competition, billing, retail) ──────────
  - name: dim_coaches
    config:
      contract:
        enforced: true
    description: One row per tennis coach, with full_name and years_at_club derived at query time.
    columns:
      - name: coach_id
        data_type: varchar
        description: Unique coach identifier. Primary key.
        data_tests:
          - unique
          - not_null
      - name: first_name
        data_type: varchar
        description: Coach's first name.
      - name: last_name
        data_type: varchar
        description: Coach's last name.
      - name: full_name
        data_type: varchar
        description: First and last name concatenated.
      - name: email
        data_type: varchar
        description: Coach's email address.
      - name: phone
        data_type: varchar
        description: Coach's phone number.
      - name: hire_date
        data_type: date
        description: Date the coach was hired.
      - name: years_at_club
        data_type: number
        description: Whole years between hire_date and today.
      - name: specialty
        data_type: varchar
        description: Coaching specialty (e.g. Junior development, Competitive).
      - name: certification_level
        data_type: varchar
        description: Coaching certification tier (Certified, Professional, Master, Elite).
      - name: hourly_rate
        data_type: number
        description: Coaching rate per hour, in euros.
      - name: is_active
        data_type: boolean
        description: True if the coach is currently employed.

  - name: dim_tournaments
    config:
      contract:
        enforced: true
    description: One row per club tournament, with derived duration.
    columns:
      - name: tournament_id
        data_type: varchar
        description: Unique tournament identifier. Primary key.
        data_tests:
          - unique
          - not_null
      - name: tournament_name
        data_type: varchar
        description: Tournament name (e.g. Summer Championship).
      - name: start_date
        data_type: date
        description: First day of the tournament.
      - name: end_date
        data_type: date
        description: Last day of the tournament.
      - name: duration_days
        data_type: number
        description: Inclusive number of days the tournament runs.
      - name: is_multi_day
        data_type: boolean
        description: True if the tournament spans more than one day.
      - name: category
        data_type: varchar
        description: Tournament category (Singles, Doubles, Mixed, Junior, Veterans).
      - name: entry_fee
        data_type: number
        description: Entry fee per participant, in euros.
      - name: max_participants
        data_type: number
        description: Maximum participant capacity.
      - name: season_year
        data_type: number
        description: Season the tournament belongs to.

  - name: dim_products
    config:
      contract:
        enforced: true
    description: One row per pro-shop product, with stock and service flags.
    columns:
      - name: product_id
        data_type: varchar
        description: Unique product identifier. Primary key.
        data_tests:
          - unique
          - not_null
      - name: product_name
        data_type: varchar
        description: Product name.
      - name: category
        data_type: varchar
        description: Product category (Racquet, Balls, Strings, Apparel, Footwear, Accessories, Services).
      - name: brand
        data_type: varchar
        description: Product brand.
      - name: unit_price
        data_type: number
        description: Retail unit price, in euros.
      - name: is_rentable
        data_type: boolean
        description: True if the product can be rented.
      - name: rental_fee
        data_type: number
        description: Rental fee, in euros. NULL for non-rentable products.
      - name: stock_quantity
        data_type: number
        description: Units currently in stock.
      - name: is_service
        data_type: boolean
        description: True if the product is a service (category = 'Services').
      - name: is_in_stock
        data_type: boolean
        description: True if stock_quantity is greater than zero.

  - name: fct_lessons
    config:
      contract:
        enforced: true
    description: One row per coaching lesson, enriched with coach and member attributes.
    columns:
      - name: lesson_id
        data_type: varchar
        description: Unique lesson identifier. Primary key.
        data_tests:
          - unique
          - not_null
      - name: lesson_date
        data_type: date
        description: Calendar date of the lesson.
      - name: start_time
        data_type: time
        description: Start time of the lesson (24-hour).
      - name: start_hour
        data_type: number
        description: Hour component of start_time (0–23).
      - name: day_of_week
        data_type: number
        description: Day-of-week integer (1 = Sunday, 7 = Saturday in Snowflake).
      - name: day_of_week_name
        data_type: varchar
        description: Full day name (e.g. Monday).
      - name: is_weekend
        data_type: boolean
        description: True if the lesson falls on Saturday or Sunday.
      - name: duration_minutes
        data_type: number
        description: Lesson duration in minutes.
      - name: lesson_type
        data_type: varchar
        description: Lesson format (Private, Semi-private, Group, Clinic).
      - name: skill_level
        data_type: varchar
        description: Target skill level (Beginner, Intermediate, Advanced).
      - name: price
        data_type: number
        description: Lesson price, in euros.
      - name: status
        data_type: varchar
        description: Lesson status (Booked, Completed, Cancelled, No-show).
      - name: is_cancelled
        data_type: boolean
        description: True if the lesson was cancelled.
      - name: court_id
        data_type: varchar
        description: Raw court identifier the lesson was booked on. 'COURT-X' for orphaned bookings.
      - name: court_number
        data_type: number
        description: Numeric court number parsed from court_id. NULL for orphaned 'COURT-X' bookings.
      - name: coach_id
        data_type: varchar
        description: Coach who taught the lesson. Foreign key to dim_coaches.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_coaches')
                field: coach_id
      - name: coach_name
        data_type: varchar
        description: Coach full name (from dim_coaches).
      - name: coach_specialty
        data_type: varchar
        description: Coach specialty (from dim_coaches).
      - name: member_id
        data_type: varchar
        description: Member who booked the lesson. Foreign key to dim_members; ~5% are deliberately orphaned ('GHOST-') for tests to catch.
        data_tests:
          - string_relationships:
              arguments:
                to: ref('dim_members')
                field: member_id
              config:
                severity: warn
      - name: gender
        data_type: varchar
        description: Member's gender (from dim_members). NULL for orphaned members.
      - name: age_group
        data_type: number
        description: Member's age group bucket. NULL for orphaned members.
      - name: city
        data_type: varchar
        description: Member's city. NULL for orphaned members.
      - name: current_type_of_membership
        data_type: varchar
        description: Member's active membership tier. NULL for orphaned members.
      - name: created_at
        data_type: timestamp_ntz
        description: Timestamp the lesson record was created.

  - name: fct_tournament_entries
    config:
      contract:
        enforced: true
    description: One row per member registration for a tournament, enriched with tournament and member attributes.
    columns:
      - name: entry_id
        data_type: varchar
        description: Unique tournament-entry identifier. Primary key.
        data_tests:
          - unique
          - not_null
      - name: tournament_id
        data_type: varchar
        description: Tournament registered for. Foreign key to dim_tournaments.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_tournaments')
                field: tournament_id
      - name: tournament_name
        data_type: varchar
        description: Tournament name (from dim_tournaments).
      - name: tournament_category
        data_type: varchar
        description: Tournament category (from dim_tournaments).
      - name: season_year
        data_type: number
        description: Season the tournament belongs to.
      - name: registration_date
        data_type: date
        description: Date the member registered.
      - name: seed
        data_type: number
        description: Seeding position within the tournament (1 = top seed).
      - name: entry_fee_paid
        data_type: number
        description: Entry fee paid, in euros.
      - name: final_placement
        data_type: varchar
        description: Final result (Champion, Runner-up, Semifinalist, … Eliminated).
      - name: is_champion
        data_type: boolean
        description: True if the member won the tournament.
      - name: member_id
        data_type: varchar
        description: Member who entered. Foreign key to dim_members; ~5% deliberately orphaned ('GHOST-').
        data_tests:
          - string_relationships:
              arguments:
                to: ref('dim_members')
                field: member_id
              config:
                severity: warn
      - name: gender
        data_type: varchar
        description: Member's gender. NULL for orphaned members.
      - name: age_group
        data_type: number
        description: Member's age group bucket. NULL for orphaned members.
      - name: city
        data_type: varchar
        description: Member's city. NULL for orphaned members.

  - name: fct_matches
    config:
      contract:
        enforced: true
    description: One row per tournament match, enriched with tournament attributes.
    columns:
      - name: match_id
        data_type: varchar
        description: Unique match identifier. Primary key.
        data_tests:
          - unique
          - not_null
      - name: tournament_id
        data_type: varchar
        description: Tournament the match belongs to. Foreign key to dim_tournaments.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_tournaments')
                field: tournament_id
      - name: tournament_name
        data_type: varchar
        description: Tournament name (from dim_tournaments).
      - name: tournament_category
        data_type: varchar
        description: Tournament category (from dim_tournaments).
      - name: season_year
        data_type: number
        description: Season the tournament belongs to.
      - name: round_name
        data_type: varchar
        description: Round of the match (Round of 32 … Final, Consolation).
      - name: match_date
        data_type: date
        description: Date the match was played.
      - name: start_time
        data_type: time
        description: Start time of the match (24-hour).
      - name: duration_minutes
        data_type: number
        description: Match duration in minutes.
      - name: court_id
        data_type: varchar
        description: Raw court identifier the match was played on.
      - name: court_number
        data_type: number
        description: Numeric court number parsed from court_id.
      - name: player1_member_id
        data_type: varchar
        description: First player. Foreign key to dim_members.
        data_tests:
          - string_relationships:
              arguments:
                to: ref('dim_members')
                field: member_id
      - name: player2_member_id
        data_type: varchar
        description: Second player. Foreign key to dim_members.
        data_tests:
          - string_relationships:
              arguments:
                to: ref('dim_members')
                field: member_id
      - name: winner_member_id
        data_type: varchar
        description: Match winner. Foreign key to dim_members.
        data_tests:
          - string_relationships:
              arguments:
                to: ref('dim_members')
                field: member_id
      - name: winner_is_player1
        data_type: boolean
        description: True if player1 won the match.
      - name: score
        data_type: varchar
        description: Final score string (e.g. "6-4, 6-3").
      - name: sets_played
        data_type: number
        description: Number of sets in the match, parsed from the score.

  - name: fct_invoices
    config:
      contract:
        enforced: true
    description: One row per billing invoice header, enriched with member attributes.
    columns:
      - name: invoice_id
        data_type: varchar
        description: Unique invoice identifier. Primary key.
        data_tests:
          - unique
          - not_null
      - name: member_id
        data_type: varchar
        description: Member billed. Foreign key to dim_members; ~5% deliberately orphaned ('GHOST-').
        data_tests:
          - string_relationships:
              arguments:
                to: ref('dim_members')
                field: member_id
              config:
                severity: warn
      - name: gender
        data_type: varchar
        description: Member's gender. NULL for orphaned members.
      - name: age_group
        data_type: number
        description: Member's age group bucket. NULL for orphaned members.
      - name: city
        data_type: varchar
        description: Member's city. NULL for orphaned members.
      - name: current_type_of_membership
        data_type: varchar
        description: Member's active membership tier. NULL for orphaned members.
      - name: invoice_date
        data_type: date
        description: Date the invoice was issued.
      - name: due_date
        data_type: date
        description: Date payment is due (invoice_date + 30 days).
      - name: paid_date
        data_type: date
        description: Date the invoice was paid. NULL if unpaid.
      - name: days_to_pay
        data_type: number
        description: Days between invoice_date and paid_date. NULL if unpaid.
      - name: total_amount
        data_type: number
        description: Invoice total, in euros (sum of line items).
      - name: status
        data_type: varchar
        description: Invoice status (Paid, Pending, Overdue).
      - name: is_paid
        data_type: boolean
        description: True if status is Paid.
      - name: is_overdue
        data_type: boolean
        description: True if status is Overdue.
      - name: payment_method
        data_type: varchar
        description: Payment method (Credit Card, Direct Debit, Bank Transfer, Cash).

  - name: fct_invoice_line_items
    config:
      contract:
        enforced: true
    description: One row per invoice line item, with the parent invoice's date and member.
    columns:
      - name: line_item_id
        data_type: varchar
        description: Unique line-item identifier. Primary key.
        data_tests:
          - unique
          - not_null
      - name: invoice_id
        data_type: varchar
        description: Parent invoice. Foreign key to fct_invoices.
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_invoices')
                field: invoice_id
      - name: invoice_date
        data_type: date
        description: Date of the parent invoice.
      - name: member_id
        data_type: varchar
        description: Member billed (from the parent invoice). ~5% deliberately orphaned ('GHOST-').
        data_tests:
          - string_relationships:
              arguments:
                to: ref('dim_members')
                field: member_id
              config:
                severity: warn
      - name: category
        data_type: varchar
        description: Line-item category (Membership, Court Fee, Lesson, Pro Shop, …).
      - name: description
        data_type: varchar
        description: Free-text line description.
      - name: quantity
        data_type: number
        description: Quantity billed.
      - name: unit_amount
        data_type: number
        description: Per-unit amount, in euros.
      - name: line_amount
        data_type: number
        description: Total line amount (quantity × unit_amount), in euros.

  - name: fct_sales_transactions
    config:
      contract:
        enforced: true
    description: One row per pro-shop sale, enriched with product and member attributes.
    columns:
      - name: transaction_id
        data_type: varchar
        description: Unique transaction identifier. Primary key.
        data_tests:
          - unique
          - not_null
      - name: transaction_date
        data_type: date
        description: Date of the sale.
      - name: member_id
        data_type: varchar
        description: Member who purchased. Foreign key to dim_members.
        data_tests:
          - string_relationships:
              arguments:
                to: ref('dim_members')
                field: member_id
      - name: gender
        data_type: varchar
        description: Member's gender (from dim_members).
      - name: age_group
        data_type: number
        description: Member's age group bucket.
      - name: city
        data_type: varchar
        description: Member's city.
      - name: product_id
        data_type: varchar
        description: Product sold. Foreign key to dim_products.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: product_name
        data_type: varchar
        description: Product name (from dim_products).
      - name: product_category
        data_type: varchar
        description: Product category (from dim_products).
      - name: product_brand
        data_type: varchar
        description: Product brand (from dim_products).
      - name: quantity
        data_type: number
        description: Units sold.
      - name: unit_price
        data_type: number
        description: Per-unit price, in euros.
      - name: discount_pct
        data_type: number
        description: Discount percentage applied (0, 10, or 20).
      - name: gross_amount
        data_type: number
        description: Quantity × unit_price before discount, in euros.
      - name: net_amount
        data_type: number
