  - name: fct_equipment_rentals
    config:
      contract:
        enforced: true
    description: One row per equipment rental, enriched with product and member attributes.
    columns:
      - name: rental_id
        data_type: varchar
        description: Unique rental identifier. Primary key.
        data_tests:
          - unique
          - not_null
      - name: member_id
        data_type: varchar
        description: Member who rented. Foreign key to dim_members.
        data_tests:
          - string_relationships:
              arguments:
                to: ref('dim_members')
                field: member_id
      - name: gender
        data_type: varchar
        description: Member's gender (from dim_members).
      - name: age_group
        data_type: number
        description: Member's age group bucket.
      - name: city
        data_type: varchar
        description: Member's city.
      - name: product_id
        data_type: varchar
        description: Product rented. Foreign key to dim_products.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: product_name
        data_type: varchar
        description: Product name (from dim_products).
      - name: product_category
        data_type: varchar
        description: Product category (from dim_products).
