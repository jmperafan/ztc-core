semantic_models:

  - name: fct_court_usage
    model: ref('fct_court_usage')
    entities:
      - name: court_usage_slot
        type: primary
        expr: slot_key
    dimensions:
      - name: court_number
        type: categorical
      - name: reservation_date
        type: time
        type_params:
          time_granularity: day
      - name: reservation_type
        type: categorical
      - name: is_winter_break
        type: categorical
    measures:
      - name: booked_minutes
        description: >
          Total minutes where reservation_type is a real booking
          (not available or closed).
        agg: sum
        agg_time_dimension: reservation_date
        expr: >
          CASE
            WHEN reservation_type NOT IN ('Beschikbaar', 'Gesloten')
            THEN duration_in_mins
            ELSE 0
          END
      - name: available_minutes
        description: >
          Total minutes where the court was open to be booked (available + booked,
          excludes closed hours). Used as the denominator for court utilization.
        agg: sum
        agg_time_dimension: reservation_date
        expr: >
          CASE
            WHEN reservation_type != 'Gesloten'
            THEN duration_in_mins
            ELSE 0
          END
      - name: total_reservations
        description: Total number of actual court reservations (excludes gap-fill and closed slots).
        agg: count
        agg_time_dimension: reservation_date
        expr: reservation_id

  - name: fct_weather
    model: ref('fct_weather')
    entities:
      - name: weather_hour
        type: primary
        expr: datetime
    dimensions:
      - name: datetime
        type: time
        type_params:
          time_granularity: hour
      - name: ideal_weather
        type: categorical
    measures:
      - name: ideal_weather_hours
        description: Count of hours where all tennis-weather conditions are met.
        agg: sum
        agg_time_dimension: datetime
        expr: "CAST(ideal_weather AS INTEGER)"

  - name: dim_members_anonimized
    model: ref('dim_members_anonimized')
    entities:
      - name: member
        type: primary
        expr: member_id
    dimensions:
      - name: member_since
        type: time
        type_params:
          time_granularity: day
      - name: gender
        type: categorical
      - name: age_group
        type: categorical
      - name: city
        type: categorical
      - name: current_type_of_membership
        type: categorical
      - name: is_club_member
        type: categorical
      - name: is_knltb_member
        type: categorical
    measures:
      - name: active_members
        description: >
          Count of distinct members who currently hold an active club membership
          (is_club_member = TRUE).
        agg: count_distinct
        agg_time_dimension: member_since
        expr: "CASE WHEN is_club_member = TRUE THEN member_id ELSE NULL END"

metrics:

  - name: booked_minutes
    description: >
      Total minutes where reservation_type is a real booking
      (not available or closed).
    type: simple
    type_params:
      measure:
        name: booked_minutes

  - name: available_minutes
    description: >
      Total minutes where the court was open to be booked (available + booked,
      excludes closed hours). Used as the denominator for court utilization.
    type: simple
    type_params:
      measure:
        name: available_minutes

  - name: court_utilization_rate
    description: >
      Percentage of available court-minutes that were actually booked.
      Closed hours are excluded from both numerator and denominator.
      A rate of 1.0 means every available minute was reserved.
      Winter-break days are excluded because courts are not operational.
    type: ratio
    type_params:
      numerator:
        name: booked_minutes
      denominator:
        name: available_minutes
    filter: |
      {{ Dimension('court_usage_slot__is_winter_break') }} = FALSE

  - name: total_reservations
    description: Total number of actual court reservations (excludes gap-fill and closed slots).
    type: simple
    type_params:
      measure:
        name: total_reservations

  - name: ideal_weather_hours
    description: Count of hours where all tennis-weather conditions are met.
    type: simple
    type_params:
      measure:
        name: ideal_weather_hours

  - name: active_members
    description: >
      Count of distinct members who currently hold an active club membership
      (is_club_member = TRUE).
    type: simple
    type_params:
      measure:
        name: active_members
