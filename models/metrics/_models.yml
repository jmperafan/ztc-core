models:
  - name: metricflow_time_spine
    description: >
      Daily date spine required by MetricFlow for time-series aggregations.
      One row per calendar day, built from dim_calendar. Must be materialized
      as a table for MetricFlow to query it efficiently.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: Calendar date at day granularity. Primary key.
        granularity: day
        data_tests:
          - unique
          - not_null

  - name: metricflow_time_spine_hour
    description: >
      Hourly datetime spine required by MetricFlow for sub-daily time-series
      aggregations. One row per hour, generated by cross-joining dim_calendar
      with a 24-row hours generator. Must be materialized as a table.
    time_spine:
      standard_granularity_column: datetime_hour
    columns:
      - name: datetime_hour
        description: Timestamp truncated to the hour. Primary key.
        granularity: hour
        data_tests:
          - unique
          - not_null
