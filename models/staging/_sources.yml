sources:
  - name: ztc
    database: RAW
    schema: ZTC
    tables:
      - name: court_usage
        description: This table contains the reservations for our courts.
        columns:
          - name: startdatum
            description: Date of the reservation.
            data_tests:
              - not_null
          - name: banen
            description: Raw court identifier string, e.g. "Baan 3".
            data_tests:
              - not_null
      - name: club_members
        description: This table contains information about our members.
        columns:
          - name: clublidnummer
            description: Unique club membership number. Primary key of this table.
            data_tests:
              - unique
              - not_null
      - name: weather_data
        description: Weather related data for the city of Utrecht.
        columns:
          - name: datetime
            description: Timestamp of the observation (hourly). Primary key of this table.
            data_tests:
              - unique
              - not_null
