sources:
  - name: ztc
    database: RAW
    schema: ZTC
    tables:
      - name: court_usage
        description: This table contains the reservations for our courts.
        columns:
          - name: startdatum
            description: Date of the reservation.
            data_tests:
              - not_null
          - name: banen
            description: Raw court identifier string, e.g. "Baan 3".
            data_tests:
              - not_null
        config:
          loaded_at_field: "CAST(startdatum AS TIMESTAMP)"
          freshness:
            warn_after: {count: 3, period: day}
            error_after: {count: 7, period: day}
      - name: club_members
        description: This table contains information about our members.
        columns:
          - name: clublidnummer
            description: Unique club membership number. Primary key of this table.
            data_tests:
              - unique
              - not_null
        config:
          loaded_at_field: "CAST(current_membership_start_date AS TIMESTAMP)"
          freshness:
            warn_after: {count: 30, period: day}
            error_after: {count: 90, period: day}
      - name: weather_data
        description: >
          Weather data for Utrecht. Timestamps are naive local time, so the 02:00 hour
          legitimately occurs twice during daylight-saving fallback.
        columns:
          - name: datetime
            description: >
              Naive local timestamp of the observation. DST duplicate shape is validated
              by the weather_duplicates_only_during_dst_fallback singular test.
            data_tests:
              - not_null
        config:
          loaded_at_field: datetime
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 3, period: day}