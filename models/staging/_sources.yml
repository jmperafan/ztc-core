sources:
  - name: ztc
    database: RAW
    schema: ZTC
    tables:
      - name: court_usage
        description: This table contains the reservations for our courts.
        loaded_at_field: startdatum
        freshness:
          warn_after: {count: 7, period: day}
          error_after: {count: 14, period: day}
      - name: club_members
        description: This table contains information about our members.
        freshness: null
      - name: weather_data
        description: Weather related data for the city of Utrecht.
        loaded_at_field: datetime
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
