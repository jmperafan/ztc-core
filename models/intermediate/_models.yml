models:
  - name: int_weather_data
    description: >
      Deduplicated weather observations. Resolves duplicate datetime values from the
      source system by keeping the first record per hour. This is the canonical
      weather grain used by fct_weather.
    columns:
      - name: datetime
        description: Timestamp of the observation (hourly). Primary key.
        data_tests:
          - unique
          - not_null

  - name: int_club_members
    description: >
      Deduplicated club members. Resolves duplicate clublidnummer values from the
      source system by keeping the most recently joined record per member_id.
      This is the canonical member grain used by dim_members.
    columns:
      - name: member_id
        description: Unique club membership number. Primary key.
        data_tests:
          - unique
          - not_null

  - name: int_court_date_spine
    description: >
      Cross-join of all court numbers and all calendar dates from dim_calendar.
      Produces a complete grid of every court × date combination, which is used
      downstream in int_court_usage to detect days with no bookings (empty_days).
    columns:
      - name: court_number
        description: Tennis court number (1–5).
        data_tests:
          - not_null
      - name: reservation_date
        description: Calendar date, sourced from dim_calendar.
        data_tests:
          - not_null

  - name: int_court_usage
    description: >
      Gap-filled court usage. Starts from actual reservations in stg_reservations
      and inserts synthetic "Beschikbaar" rows to cover every unbooked slot within
      operating hours (opening_time to closing_time). Also handles days with no
      bookings at all via the empty_days CTE. The result covers every operating
      hour of every day per court; closed-hour rows are added downstream in
      int_court_slots.
    columns:
      - name: reservation_id
        description: >
          ID of the original reservation for actual bookings. NULL for synthetic
          gap-fill rows (Beschikbaar slots).
      - name: court_number
        description: Tennis court number (1–5).
        data_tests:
          - not_null
      - name: reservation_date
        description: Calendar date of the slot.
        data_tests:
          - not_null
      - name: start_time
        description: Start time of the slot (TIME, 24-hour).
      - name: end_time
        description: End time of the slot (TIME, 24-hour).
      - name: reservation_type
        description: >
          Type of slot. "Beschikbaar" for gap-fill (available) rows;
          original reservation_type for actual bookings.
      - name: event_description
        description: >
          Description of the slot. "Niet geboekt" for available gaps;
          original event_description for actual bookings.

  - name: int_court_slots
    description: >
      Every court-slot of every day, keyed by slot_key (court_number, date,
      start_time). Unions int_court_usage with morning + evening closed-hour
      rows and adds slot_key, is_winter_break, and duration_in_mins. This is
      the logic that used to live in fct_court_usage; the mart is now a thin
      passthrough.
    columns:
      - name: slot_key
        description: >
          Surrogate primary key — CONCAT(court_number, '_', reservation_date,
          '_', start_time). Uniquely identifies a slot.
        data_tests:
          - unique
          - not_null

  - name: int_daily_court_stats
    description: >
      Daily aggregation of court usage per court_number × reservation_date,
      excluding winter-break days. Provides booked/available slot counts and
      minutes plus utilization_pct. Feeds the thin fct_daily_court_stats mart.
    columns:
      - name: daily_court_key
        description: Surrogate key — CONCAT(court_number, '_', reservation_date).
        data_tests:
          - unique
          - not_null

  - name: int_hourly_weather_usage
    description: >
      Court usage aggregated to hourly grain (court × date × hour), excluding
      winter-break and closed hours, joined with hourly weather observations
      from fct_weather. Feeds the thin fct_hourly_weather_usage mart.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - reservation_date
              - start_hour
              - court_number

  - name: int_reservation_events
    description: >
      Actual court bookings enriched with member demographics via
      bridge_member_reservations and dim_members. Adds day_of_week,
      day_of_week_name, and start_hour. Feeds the thin fct_reservation_events
      microbatch mart.
    columns:
      - name: reservation_id
        description: Surrogate key for the reservation. Primary key.
        data_tests:
          - unique
          - not_null

  - name: int_reservations_hwm
    description: >
      Actual court bookings enriched with member demographics and the hourly
      weather observation at the booking's date/hour. Feeds the thin
      fct_reservations_hwm mart, which adds the High Watermark window filter.
    columns:
      - name: reservation_id
        description: Surrogate key for the reservation. Primary key.
        data_tests:
          - unique
          - not_null
