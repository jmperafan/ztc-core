# ──────────────────────────────────────────────────────────────────────────────
# DEMO: dbt_project.yml feature showcase
# ──────────────────────────────────────────────────────────────────────────────

name: 'ztc_core'
profile: 'ztc_core'

# ── dbt platform binding ─────────────────────────────────────────────────────
# Binds this repo to the "ztc-core" project on de392.us1.dbt.com. Required by
# the dbt platform CLI, which reads warehouse credentials from the platform
# (Account settings -> Credentials) instead of a local profiles.yml.
#
# The Fusion engine binary does not use this for credentials — it still resolves
# ~/.dbt/profiles.yml — but it does read this block to fetch a deferral
# manifest, so a valid token in ~/.dbt/dbt_cloud.yml matters for both CLIs.
dbt-cloud:
  project-id: 70437463665591

# ── 1. REQUIRE A MINIMUM dbt VERSION ─────────────────────────────────────────
# Prevents running this project on an older dbt-core that lacks features we use
# (e.g., microbatch, unit tests, materializations introduced in 1.8).
# Accepts a version range: ">=1.8.0,<2.0.0" is also valid.
require-dbt-version: ">=1.8.0"

# ── File-path configuration (unchanged) ──────────────────────────────────────
model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# ──────────────────────────────────────────────────────────────────────────────
# 2. VARIABLES
# vars values are rendered as Jinja at parse time, so env_var() works here.
#
# Kept in dbt_project.yml rather than vars.yml. Local Fusion reads vars.yml
# fine, but the dbt platform CLI syncs the project to a remote runner and
# vars.yml does not survive the trip — vars arrive empty and every var()
# reference fails. Defining them here works for both. Note the two files are
# mutually exclusive: Fusion errors if vars appear in both, so there is no
# partial migration.
# ──────────────────────────────────────────────────────────────────────────────
vars:
  # Override at runtime:  DBT_START_DATE=2023-01-01 dbt run
  start_date: "{{ env_var('DBT_START_DATE', '2022-01-01') }}"
  watermark_schema: watermark
  watermark_table: dbt_high_watermark
  opening_time: "{{ env_var('ZTC_OPENING_TIME', '08:00:00') }}"
  closing_time: "{{ env_var('ZTC_CLOSING_TIME', '23:00:00') }}"
  court_numbers: [1, 2, 3, 4, 5]
  # Each entry is [start_date, end_date] for a closed winter period.
  # Add a new pair each season; the is_winter_break macro iterates over this list.
  winter_breaks:
    - ["2022-01-01", "2022-03-19"]
    - ["2022-12-06", "2023-03-26"]

# ──────────────────────────────────────────────────────────────────────────────
# 3. MODEL CONFIGS
#    Every key is prefixed with + so dbt treats it as a config, not a folder.
# ──────────────────────────────────────────────────────────────────────────────
models:
  ztc_core:

    # ── Project-wide defaults ────────────────────────────────────────────────
    +static_analysis: strict
    +persist_docs:             # propagates model/column descriptions to Snowflake
      relation: true
      columns: true

    # ── 3a. STAGING LAYER ────────────────────────────────────────────────────
    # private: only models in this project can ref staging models
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging", "raw"]
      +group: analytics_engineering
      +access: private

    # ── 3b. INTERMEDIATE LAYER ───────────────────────────────────────────────
    # private: implementation detail; downstream projects must use core models
    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: ["intermediate"]
      +group: analytics_engineering
      +access: private
      +grants:
        select: ["TRANSFORMER"]

    # ── 3c. CORE LAYER ───────────────────────────────────────────────────────
    # public: exposed to ztc_analytics and any other downstream project via
    # cross-project ref('ztc_core', '<model>')
    core:
      +materialized: table
      +schema: core
      +tags: ["core", "certified"]
      +group: analytics_engineering
      +access: public
      +grants:
        select: ["TRANSFORMER"]
      +meta:
        owner: "data-engineering"
        sla: "daily"

snapshots:
  ztc_core:
    +group: analytics_engineering
flags:
  require_generic_test_arguments_property: true
