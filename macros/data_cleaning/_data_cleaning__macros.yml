macros:
  - name: dutch_bool
    description: >
      Parses Dutch boolean text into a real SQL BOOLEAN. The ZTC reservation
      system stores yes/no flags as the literal Dutch words `ja` and `nee`,
      so columns like `clublid` and `bondslid` arrive as VARCHAR. Returns
      TRUE for `ja`, FALSE for `nee`, NULL for everything else (NULL, empty
      strings, whitespace, or unrecognised text). Trimming and lowercasing
      are applied. Deliberately strict: unrecognised values become NULL
      rather than coercing to FALSE so source-data drift surfaces in
      downstream tests rather than being silently rewritten.
    arguments:
      - name: column
        type: string
        description: The column or expression containing the Dutch boolean text.

  - name: age_group
    description: >
      Bins a continuous age value into 10-year groups by flooring to the nearest decade.
      A member aged 39 falls into the `30` bucket; a member aged 40 falls into `40`.
    arguments:
      - name: age
        type: integer
        description: The age value to bin (typically DATEDIFF in years from birth_date).

  - name: clean_text
    description: >
      Standardises a text column by converting to lowercase, trimming leading and
      trailing whitespace, and collapsing internal whitespace sequences to a single space.
    arguments:
      - name: column
        type: string
        description: The column or expression to clean.

  - name: time_to_24_h
    description: >
      Converts a 12-hour time string (e.g. `'2:00:00 pm'`) to 24-hour format
      (e.g. `'14:00:00'`). Handles the 12:xx am/pm edge case correctly.
    arguments:
      - name: column
        type: string
        description: The column containing a 12-hour time string with an am/pm suffix.
