macros:
  - name: check_target
    description: >
      Diagnostic macro that logs every field on the dbt `target` object plus
      core run context (dbt_version, invocation_id, run_started_at, execute).
      Useful when verifying which warehouse/role/database a run is pointed at,
      or when debugging schema-name generation. Invoke with `dbt run-operation
      check_target`.

  - name: dutch_bool
    description: >
      Parses Dutch boolean text into a real SQL BOOLEAN. The ZTC reservation
      system stores yes/no flags as the literal Dutch words `ja` and `nee`,
      so columns like `clublid` and `bondslid` arrive as VARCHAR. Returns
      TRUE for `ja`, FALSE for `nee`, NULL for everything else (NULL, empty
      strings, whitespace, or unrecognised text). Trimming and lowercasing
      are applied. Deliberately strict: unrecognised values become NULL
      rather than coercing to FALSE so source-data drift surfaces in
      downstream tests rather than being silently rewritten.
    arguments:
      - name: column
        type: string
        description: The column or expression containing the Dutch boolean text.

  - name: snowflake__get_hwm
    description: >
      Snowflake-specific implementation of the `get_hwm` dispatch target.
      Called by get_current_hwm / get_previous_hwm via adapter.dispatch.
      Returns a subquery that resolves to either the current invocation's
      pending upper bound (complete = false, matched by invocation_id) or
      the last successful run's upper bound (complete = true). Falls back
      to `1900-01-01` when no successful run exists.
    arguments:
      - name: current
        type: boolean
        description: If true, look up the current (pending) HWM; otherwise the previous successful one.
      - name: relation_obj
        type: relation
        description: The upstream relation used as source_name in the watermark table.

  - name: age_group
    description: >
      Bins a continuous age value into 10-year groups by flooring to the nearest decade.
      A member aged 39 falls into the `30` bucket; a member aged 40 falls into `40`.
    arguments:
      - name: age
        type: integer
        description: The age value to bin (typically DATEDIFF in years from birth_date).

  - name: tennis_weather
    description: >
      Returns a boolean SQL condition that evaluates to true when outdoor conditions
      are suitable for tennis at ZTC. Conditions: temperature between 10°C and 35°C,
      no precipitation, and wind speed at or below 20 km/h.
    arguments:
      - name: temperature
        type: float
        description: Temperature column name, in degrees Celsius.
      - name: precipitation
        type: float
        description: Precipitation column name, in millimetres.
      - name: wind_speed
        type: float
        description: Wind speed column name, in kilometres per hour.

  - name: clean_text
    description: >
      Standardises a text column by converting to lowercase, trimming leading and
      trailing whitespace, and collapsing internal whitespace sequences to a single space.
    arguments:
      - name: column
        type: string
        description: The column or expression to clean.

  - name: time_to_24_h
    description: >
      Converts a 12-hour time string (e.g. `'2:00:00 pm'`) to 24-hour format
      (e.g. `'14:00:00'`). Handles the 12:xx am/pm edge case correctly.
    arguments:
      - name: column
        type: string
        description: The column containing a 12-hour time string with an am/pm suffix.

  - name: generate_schema_name
    description: >
      Overrides dbt's built-in schema name generation. In production (target.name == 'prod'),
      models with a custom schema are placed directly into that schema (e.g. `staging`, `core`,
      `marts`). In all other environments, the custom schema is prefixed with the target schema
      to namespace runs by developer (e.g. `dbt_jperafan_staging`). Models without a custom
      schema always use the target schema as-is.
    arguments:
      - name: custom_schema_name
        type: string
        description: The custom schema from the model config (+schema). Null if not set.
      - name: node_obj
        type: any
        description: The dbt node object for the model being compiled.

  - name: test_is_between
    description: >
      Generic data test that fails when a non-null column value falls outside the
      inclusive range [min_value, max_value]. Apply it in a schema YAML file under
      data_tests to validate numeric columns such as court_number (1–5) or playing
      strength ratings. Reference it in YAML as `is_between` (dbt adds the test_ prefix).
    arguments:
      - name: model
        type: relation
        description: The model being tested (injected automatically by dbt).
      - name: column_name
        type: string
        description: The column to validate.
      - name: min_value
        type: float
        description: Inclusive lower bound.
      - name: max_value
        type: float
        description: Inclusive upper bound.

  - name: precipitation_alert_threshold
    description: >
      Returns the precipitation level in millimetres above which outdoor conditions
      are flagged as unsuitable for play. Reads the DBT_PRECIPITATION_ALERT_MM
      environment variable; defaults to 2 mm when the variable is not set.
      Demonstrates the env_var() pattern for runtime-configurable thresholds.

  - name: is_winter_break
    description: >
      Returns a boolean SQL condition that evaluates to true when a date falls within
      a known ZTC winter break period. Winter breaks are the periods when outdoor courts
      are closed. Date ranges are driven by the winter_breaks variable in dbt_project.yml —
      add a new [start, end] pair each season rather than editing the macro.
    arguments:
      - name: date_expr
        type: string
        description: The date column to evaluate.

  - name: set_job_param
    description: >
      Pre-hook for the high-watermark (HWM) incremental pattern. Reads the maximum
      value of the hwm_field from each upstream model or source and records it as the
      current processing window's upper bound in the watermark table before the model
      runs. Creates the watermark schema and table on first use. Configure the target
      model with meta.hwm_field (the timestamp column) and optionally meta.hwm_source_model
      (to pin a specific upstream node when there are multiple dependencies).

  - name: update_job_param
    description: >
      Post-hook for the high-watermark pattern. Marks the current invocation's watermark
      row as complete after a successful run. On --full-refresh, deletes all existing
      watermark rows for the target model so the next run starts from the beginning.
    arguments:
      - name: success
        type: boolean
        description: Whether to mark the run as complete (default true).

  - name: get_current_hwm
    description: >
      Returns a subquery that resolves to the upper-bound timestamp recorded by
      set_job_param for the current invocation. Use in an incremental WHERE clause
      as the upper bound of the processing window. Dispatches to snowflake__get_hwm.
    arguments:
      - name: relation_obj
        type: relation
        description: The upstream model relation used as source_name in the watermark table.

  - name: get_previous_hwm
    description: >
      Returns a subquery that resolves to the upper-bound timestamp of the last
      successfully completed run. Use as the lower bound of the processing window.
      Returns '1900-01-01' when no prior successful run exists (i.e. first run).
    arguments:
      - name: relation_obj
        type: relation
        description: The upstream model relation used as source_name in the watermark table.

  - name: get_hwm_fqn
    description: >
      Returns the fully qualified name of the watermark tracking table
      (database.schema.table). Driven by the watermark_database, watermark_schema,
      and watermark_table project variables.
    arguments:
      - name: schema
        type: boolean
        description: If true, returns only database.schema (no table name).

  - name: create_hwm_table
    description: >
      Creates the watermark tracking table if it does not already exist. Called
      automatically by set_job_param on first use.

  - name: create_watermark_schema
    description: >
      Creates the watermark schema if it does not already exist. Called
      automatically by set_job_param before creating the table.
