dbt_artifacts_dir: target

# ──────────────────────────────────────────────────────────────────────────────
# FOUNDATION PROJECT — strict governance
#
# This project is the authoritative source of truth for ZTC data. All public
# core models are consumed by ztc_analytics via cross-project refs, so we
# enforce contracts, descriptions, naming conventions, and test coverage here.
# ──────────────────────────────────────────────────────────────────────────────

manifest_checks:

  # ── Naming conventions ────────────────────────────────────────────────────
  - name: check_model_names
    include: ^models/staging
    model_name_pattern: ^stg_

  - name: check_model_names
    include: ^models/intermediate
    model_name_pattern: ^(int_|bridge_)

  - name: check_model_names
    include: ^models/core
    model_name_pattern: ^(fct_|dim_|bridge_)

  # ── Descriptions required on every model ─────────────────────────────────
  - name: check_model_description_populated
    include: ^models/

  # ── Column-level descriptions on core models are enforced by dbt-checkpoint
  # (check-model-columns-have-desc) in the pre-commit workflow. dbt-bouncer
  # dropped its column-documentation check in newer versions.

  # ── Contracts must be enforced on every public core model ─────────────────
  # The 4 incremental marts are excluded because incremental + contracts +
  # on_schema_change=fail traps on Snowflake's natural NUMBER(p,s) precisions
  # drifting from a generic `number` contract declaration. They keep table
  # materializations.
  - name: check_model_has_contracts_enforced
    include: ^models/core
    exclude: ^models/core/(fct_reservation_events|fct_reservations_hwm|fct_daily_court_stats|fct_hourly_weather_usage)\.sql$

  # ── Every core model must have a uniqueness test on its primary key ───────
  # The previous check_model_has_tests_by_name (which also enforced not_null)
  # was removed upstream; dbt-checkpoint's check-model-has-tests catches the
  # broader "has at least one test" case for staging.
  - name: check_model_has_unique_test
    include: ^models/core

  # ── Keep the DAG shallow: cap direct dependents per model ─────────────────
  # dim_members is a conformed hub consumed by the reservations pipeline plus
  # the coaching/billing/retail facts (7 direct dependents), so the cap is 8.
  - name: check_model_max_fanout
    include: ^models/
    max_downstream_models: 8

  # ── Source freshness: all sources must declare a loaded_at_field ──────────
  - name: check_source_freshness_populated
    include: ^models/staging

  # ── Staging models must reference at most one source (no early raw joins) ─
  - name: check_model_depends_on_multiple_sources
    include: ^models/staging
