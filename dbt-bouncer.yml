# ══════════════════════════════════════════════════════════════════════════════
# RUN RESULTS CHECKS — require target/run_results.json from a real `dbt build`
#
# `dbt parse` writes a run_results.json containing only the parse step, so these
# are only meaningful when pointed at the artifacts of a production run.
# ══════════════════════════════════════════════════════════════════════════════
# run_results_checks:
#   - name: check_run_results_max_execution_time
#     max_execution_time_seconds: 300
